# Experimental profile only: unofficial ChatGPT Web transcription bridge.
# Combine with docker-compose.custom-speech.yml. Never publish this daemon's
# port to a public interface: it is reachable only from sibling containers on
# application-internal, and from an operator's own machine through an SSH
# tunnel to 127.0.0.1 on the host for one-time browser-extension pairing.
# See docs/speech-backend-switch.md for the pairing runbook.
services:
  custom-speech:
    depends_on:
      chatgpt-bridge:
        condition: service_healthy
    environment:
      # Left unset until the bridge is paired: bridge-up must succeed before the token exists.
      # custom-speech settings validation fails closed on startup if this is empty when selected.
      MTBANK_CUSTOM_SPEECH__ASR_API_KEY: ${CHATGPT_BRIDGE_API_TOKEN:-}
      MTBANK_CUSTOM_SPEECH__ASR_ENDPOINT: http://chatgpt-bridge:37182/v1/audio/transcriptions
      MTBANK_CUSTOM_SPEECH__ASR_MODEL: gpt-4o-transcribe
      MTBANK_CUSTOM_SPEECH__PIPELINE_REVISION: speech/chatgpt-bridge-semantic-vad-v2
      NO_PROXY: localhost,127.0.0.1,::1,custom-speech,chatgpt-bridge,gateway
      no_proxy: localhost,127.0.0.1,::1,custom-speech,chatgpt-bridge,gateway

  chatgpt-bridge:
    image: mtbank-ai-chatgpt-bridge:local
    build:
      context: .
      dockerfile: docker/chatgpt-bridge.Dockerfile
    command: ["--listen", "0.0.0.0:37182", "--language", "ru-RU", "serve"]
    environment:
      # chatgpt.com is geo-blocked from most datacenter ranges (every path answers
      # 403, including robots.txt), so this daemon is the one service that may need
      # an egress proxy. Empty by default: no proxy, direct egress, fail-closed.
      HTTP_PROXY: ${CHATGPT_BRIDGE_EGRESS_PROXY:-}
      HTTPS_PROXY: ${CHATGPT_BRIDGE_EGRESS_PROXY:-}
      ALL_PROXY: ${CHATGPT_BRIDGE_EGRESS_PROXY:-}
      http_proxy: ${CHATGPT_BRIDGE_EGRESS_PROXY:-}
      https_proxy: ${CHATGPT_BRIDGE_EGRESS_PROXY:-}
      all_proxy: ${CHATGPT_BRIDGE_EGRESS_PROXY:-}
      # Sibling services stay direct even when the proxy above is set.
      NO_PROXY: localhost,127.0.0.1,::1,custom-speech,chatgpt-bridge,gateway
      no_proxy: localhost,127.0.0.1,::1,custom-speech,chatgpt-bridge,gateway
    ports:
      - "127.0.0.1:37182:37182"
    networks:
      - application-internal
      - model-egress
    volumes:
      - chatgpt-bridge-config:/home/app/.config/chatgpt-transcribe-connect
    tmpfs:
      - /tmp:mode=1700,size=128m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:37182/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 512m
    pids_limit: 64

volumes:
  chatgpt-bridge-config:
