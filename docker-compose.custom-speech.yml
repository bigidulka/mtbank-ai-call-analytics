# Experimental no-GPU profile: OpenAI ASR + semantic roles + FFmpeg VAD.
# RunPod remains default production profile; this overlay is explicit opt-in.
services:
  api:
    depends_on: !override
      secrets-preflight:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      custom-speech:
        condition: service_healthy
    environment:
      MTBANK_SPEECH__MODE: internal_http
      MTBANK_SPEECH__BASE_URL: http://custom-speech:8010
      MTBANK_SPEECH__TRANSCRIPTION_PATH: /v1/transcribe
      MTBANK_SPEECH__TIMEOUT_SECONDS: "180"

  custom-speech:
    image: ${MTBANK_CUSTOM_SPEECH_IMAGE:-mtbank-ai-custom-speech:local}
    build:
      context: .
      dockerfile: docker/custom-speech.Dockerfile
    environment:
      # Optional at compose-parse time so overlays (e.g. docker-compose.chatgpt-bridge.yml)
      # can target only a sibling service without every var being resolvable yet;
      # CustomSpeechSettings still fails closed on startup if this is empty when selected.
      MTBANK_CUSTOM_SPEECH__ASR_API_KEY: ${OPENAI_TRANSCRIPTION_API_KEY:-}
      MTBANK_CUSTOM_SPEECH__ASR_ENDPOINT: ${OPENAI_TRANSCRIPTION_ENDPOINT:-https://api.openai.com/v1/audio/transcriptions}
      MTBANK_CUSTOM_SPEECH__ASR_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      # Semantic role reconstruction defaults to the application gateway, but may be pointed
      # at its own gateway/key: this leg is on the critical path of transcription itself, so a
      # quota block here takes the whole backend down, unlike for the analysis agents.
      # CustomSpeechSettings fails closed on startup if the resolved value is empty or non-HTTPS.
      MTBANK_CUSTOM_SPEECH__ROLE_BASE_URL: ${MTBANK_CUSTOM_SPEECH_ROLE_BASE_URL:-$MTBANK_AGENT_RUNTIME__GATEWAY__BASE_URL}
      MTBANK_CUSTOM_SPEECH__ROLE_API_KEY: ${MTBANK_CUSTOM_SPEECH_ROLE_API_KEY:-$MTBANK_AGENT_RUNTIME__GATEWAY__API_KEY}
      MTBANK_CUSTOM_SPEECH__ROLE_MODEL: ${MTBANK_CUSTOM_SPEECH__ROLE_MODEL:-gpt-5.6-sol}
      MTBANK_CUSTOM_SPEECH__ROLE_TIMEOUT_SECONDS: "30"
      MTBANK_CUSTOM_SPEECH__VAD_NOISE_DB: "-45"
      MTBANK_CUSTOM_SPEECH__VAD_MINIMUM_SILENCE_SECONDS: "0.25"
      MTBANK_CUSTOM_SPEECH__PIPELINE_REVISION: speech/openai-semantic-vad-v1
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,::1,custom-speech,gateway
      no_proxy: localhost,127.0.0.1,::1,custom-speech,gateway
    expose:
      - "8010"
    networks:
      - application-internal
      - model-egress
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8010/health/ready', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    pids_limit: 128
