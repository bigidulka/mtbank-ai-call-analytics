<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Transcribe Connector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><span class="dot" id="dot"></span><div><h1>Transcribe Connector</h1><p id="daemon">Checking daemon…</p></div></header>
    <ol>
      <li>Sign in at <a href="https://chatgpt.com" target="_blank">chatgpt.com</a>.</li>
      <li>Run <code>chatgpt-transcribe-connect pair</code>.</li>
      <li>Paste one-time code below.</li>
    </ol>
    <label for="code">Pairing code</label>
    <input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="Paste code">
    <button id="connect">Connect ChatGPT</button>
    <p class="status" id="status" role="status"></p>
    <details><summary>What is shared?</summary><p>Extension sends ChatGPT session credentials only to daemon at <code>127.0.0.1</code>. Nothing is sent to project servers.</p></details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
